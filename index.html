<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudHub - Hub de Estudos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <h2>📚 EstudHub</h2>
      </div>
      <nav class="menu">
        <button class="nav-btn active" data-target="dashboard">Dashboard</button>
        <button class="nav-btn" data-target="materias">Minhas Matérias</button>
      </nav>
    </aside>

    
    <main class="main-content">
      <header class="header">
        <h1>Central de Organização</h1>
        <p>Reúna todos os seus links, anotações e arquivos em um só lugar.</p>
      </header>

      <section class="card form-card">
        <h3>Adicionar Novo Material</h3>
        <form id="material-form">
          <div class="form-group">
            <input type="text" id="titulo" placeholder="Título (ex: Resumo de Geometria)" required>
          </div>
          <div class="form-group">
            <select id="materia" required>
              <option value="" disabled selected>Selecione a Matéria</option>
              <option value="Matemática">Matemática</option>
              <option value="História">História</option>
              <option value="Biologia">Biologia</option>
              <option value="Português">Português</option>
            </select>
          </div>
          <div class="form-group">
            <input type="url" id="link" placeholder="Link do Drive, Notion ou Vídeo" required>
          </div>
          <button type="submit" class="btn-primary">Salvar Material</button>
        </form>
      </section>

    
      <section class="card list-card">
        <div class="list-header">
          <h3>Seus Materiais Cadastrados</h3>
          <select id="filter-materia">
            <option value="todos">Todas as Matérias</option>
            <option value="Matemática">Matemática</option>
            <option value="História">História</option>
            <option value="Biologia">Biologia</option>
            <option value="Português">Português</option>
          </select>
        </div>

        <ul id="materials-list" class="materials-grid">
          
        </ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
